<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PACD - Painel Eleitoral</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            accent: {
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e',
              indigo: '#6366f1',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary detectou erro:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex flex-col items-center justify-center p-12 text-center bg-[#111827] border border-gray-800 rounded-xl my-4">
              <div className="w-12 h-12 mb-3 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold text-xl">!</div>
              <button
                type="button"
                onClick={() => this.setState({ hasError: false })}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-semibold transition"
              >
                Recarregar Painel
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function formatMoeda(val) {
      if (val === undefined || val === null || isNaN(val)) return "R$ 0,00";
      return "R$ " + Number(val).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatMoedaCompacta(val) {
      if (val === undefined || val === null || isNaN(val)) return "R$ 0,00";
      const num = Number(val);
      if (num >= 1e9) {
        return "R$ " + (num / 1e9).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Bi";
      }
      if (num >= 1e6) {
        return "R$ " + (num / 1e6).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Mi";
      }
      if (num >= 1e3) {
        return "R$ " + (num / 1e3).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " mil";
      }
      return "R$ " + num.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatNumero(val) {
      if (val === undefined || val === null || isNaN(val)) return "0";
      return Number(val).toLocaleString("pt-BR");
    }

    function truncateText(str, maxLen = 22) {
      if (!str) return "";
      return str.length > maxLen ? str.substring(0, maxLen) + "..." : str;
    }

    function ChartCanvas({ type, data, options, id, height }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
          chartInstanceRef.current = null;
        }

        try {
          const ctx = canvasRef.current.getContext('2d');
          chartInstanceRef.current = new Chart(ctx, {
            type: type || 'bar',
            data: data,
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: { color: '#9ca3af', font: { size: 11 } }
                },
                tooltip: {
                  backgroundColor: '#1f2937',
                  titleColor: '#f9fafb',
                  bodyColor: '#e5e7eb',
                  borderColor: '#374151',
                  borderWidth: 1,
                }
              },
              scales: {
                x: {
                  ticks: { color: '#9ca3af', font: { size: 10 } },
                  grid: { color: '#1f2937' }
                },
                y: {
                  ticks: { color: '#9ca3af', font: { size: 10 } },
                  grid: { color: '#1f2937' }
                }
              },
              ...options
            }
          });
        } catch (err) {
          console.error("Erro ao inicializar Chart.js:", id, err);
        }

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }
        };
      }, [data, options, type]);

      return (
        <div className="chart-container" style={height ? { height: `${height}px` } : undefined}>
          <canvas ref={canvasRef} id={id}></canvas>
        </div>
      );
    }

    const NOMES_UFS = {
      AC: "Acre", AL: "Alagoas", AP: "Amapá", AM: "Amazonas", BA: "Bahia",
      CE: "Ceará", DF: "Distrito Federal", ES: "Espírito Santo", GO: "Goiás",
      MA: "Maranhão", MT: "Mato Grosso", MS: "Mato Grosso do Sul", MG: "Minas Gerais",
      PA: "Pará", PB: "Paraíba", PR: "Paraná", PE: "Pernambuco", PI: "Piauí",
      RJ: "Rio de Janeiro", RN: "Rio Grande do Norte", RS: "Rio Grande do Sul",
      RO: "Rondônia", RR: "Roraima", SC: "Santa Catarina", SP: "São Paulo",
      SE: "Sergipe", TO: "Tocantins"
    };

    const BRAZIL_MAP_GRID = [
      [null, null, 'RR', null, 'AP', null, null, null],
      [null, 'AM', 'PA', 'MA', 'CE', 'RN', null, null],
      ['AC', 'RO', 'TO', 'PI', 'PB', 'PE', null, null],
      [null, 'MT', 'GO', 'DF', 'BA', 'AL', 'SE', null],
      [null, 'MS', 'MG', 'ES', null, null, null, null],
      [null, null, 'SP', 'RJ', null, null, null, null],
      [null, 'PR', 'SC', null, null, null, null, null],
      [null, 'RS', null, null, null, null, null, null],
    ];

    const ANOS_PADRAO = [2024, 2022, 2020, 2018];
    const CARGOS_PADRAO = {
      2018: ["DEPUTADO FEDERAL", "DEPUTADO ESTADUAL", "DEPUTADO DISTRITAL", "SENADOR", "GOVERNADOR", "PRESIDENTE"],
      2022: ["DEPUTADO FEDERAL", "DEPUTADO ESTADUAL", "DEPUTADO DISTRITAL", "SENADOR", "GOVERNADOR", "PRESIDENTE"],
      2020: ["PREFEITO", "VEREADOR"],
      2024: ["PREFEITO", "VEREADOR"]
    };
    const UFS_PADRAO = [
      "AC", "AL", "AM", "AP", "BA", "CE", "DF", "ES", "GO", "MA", "MG", "MS", "MT",
      "PA", "PB", "PE", "PI", "PR", "RJ", "RN", "RO", "RR", "RS", "SC", "SE", "SP", "TO"
    ];
    const PARTIDOS_PADRAO = [
      "AVANTE", "CIDADANIA", "MDB", "NOVO", "PATRIOTA", "PC do B", "PDT", "PL",
      "PODE", "PP", "PRD", "PROS", "PRTB", "PSB", "PSC", "PSD", "PSDB", "PSOL",
      "PSTU", "PT", "PTB", "PV", "REDE", "REPUBLICANOS", "SOLIDARIEDADE", "UNIÃO"
    ];

    function getHeatColor(val, min, max, alpha = 1) {
      if (val === undefined || val === null || isNaN(val) || val <= 0) {
        return `rgba(31, 41, 55, ${alpha})`;
      }
      const t = max > min ? Math.max(0, Math.min(1, (val - min) / (max - min))) : 0.5;
      let r, g, b;
      if (t < 0.25) {
        const s = t / 0.25;
        r = Math.round(254 + (253 - 254) * s);
        g = Math.round(240 + (224 - 240) * s);
        b = Math.round(138 + (71 - 138) * s);
      } else if (t < 0.5) {
        const s = (t - 0.25) / 0.25;
        r = Math.round(253 + (249 - 253) * s);
        g = Math.round(224 + (115 - 224) * s);
        b = Math.round(71 + (22 - 71) * s);
      } else if (t < 0.75) {
        const s = (t - 0.5) / 0.25;
        r = Math.round(249 + (239 - 249) * s);
        g = Math.round(115 + (68 - 115) * s);
        b = Math.round(22 + (68 - 22) * s);
      } else {
        const s = (t - 0.75) / 0.25;
        r = Math.round(239 + (153 - 239) * s);
        g = Math.round(68 + (27 - 68) * s);
        b = Math.round(68 + (27 - 68) * s);
      }
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getHeatTextColor(val, min, max) {
      if (!val || val <= 0) return '#6b7280';
      const t = max > min ? (val - min) / (max - min) : 0;
      return t > 0.4 ? '#ffffff' : '#111827';
    }

    function PanoramaFederativoHeatmap({ data }) {
      const [hoveredUf, setHoveredUf] = useState(null);

      const ufsData = Array.isArray(data) ? data : [];
      const ufsMap = {};
      ufsData.forEach(d => {
        if (d && d.uf) {
          ufsMap[d.uf] = Number(d.total) || 0;
        }
      });

      const totals = ufsData.map(d => Number(d.total) || 0).filter(t => t > 0);
      const minVal = totals.length > 0 ? Math.min(...totals) : 0;
      const maxVal = totals.length > 0 ? Math.max(...totals) : 1;
      const sumVal = ufsData.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0);

      const topUf = ufsData.length > 0 ? ufsData[0] : null;
      const activeUf = hoveredUf || (topUf ? topUf.uf : null);
      const activeTotal = activeUf ? (ufsMap[activeUf] || 0) : 0;
      const activePct = sumVal > 0 ? ((activeTotal / sumVal) * 100).toFixed(1) : "0.0";

      return (
        <div className="bg-[#1f2937]/50 border border-gray-800 p-5 rounded-xl lg:col-span-2 space-y-4 shadow-lg">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-gray-800 gap-3">
            <div>
              <h3 className="text-base font-bold text-white tracking-wide flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                Panorama Federativo e Mapa de Calor do Brasil
              </h3>
              <p className="text-xs text-gray-400 mt-0.5">
                Concentração territorial do financiamento eleitoral por Unidade da Federação.
              </p>
            </div>
            <div className="flex items-center gap-2 bg-[#111827]/80 px-3 py-1.5 rounded-lg border border-gray-700/60 shrink-0">
              <span className="text-xs text-gray-400 font-medium font-mono">{formatMoedaCompacta(minVal)}</span>
              <div className="w-24 sm:w-36 h-2.5 rounded-full bg-gradient-to-r from-[#fef08a] via-[#fb923c] via-[#ef4444] to-[#991b1b] border border-gray-700"></div>
              <span className="text-xs text-gray-200 font-bold font-mono">{formatMoedaCompacta(maxVal)}</span>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
            {/* Mapa de Calor Cartográfico (Grid 8x8) */}
            <div className="lg:col-span-5 flex flex-col items-center justify-center p-4 bg-[#111827]/50 rounded-xl border border-gray-800/80">
              <div className="w-full bg-[#1f2937]/80 border border-gray-700/60 rounded-lg px-3.5 py-2 mb-3 flex items-center justify-between gap-2 min-h-[38px]">
                {activeUf ? (
                  <>
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="bg-blue-600 text-white font-mono text-xs font-bold px-2 py-0.5 rounded shadow-sm shrink-0">
                        {activeUf}
                      </span>
                      <span className="text-sm font-bold text-gray-100 truncate">
                        {NOMES_UFS[activeUf] || activeUf}
                      </span>
                    </div>
                    <div className="text-right shrink-0">
                      <span className="text-sm font-mono font-bold text-emerald-400 block leading-tight">
                        {formatMoeda(activeTotal)}
                      </span>
                      <span className="text-xs font-mono text-amber-300 font-semibold">
                        {activePct}% do recorte
                      </span>
                    </div>
                  </>
                ) : (
                  <span className="text-xs text-gray-400">Passe o mouse sobre um estado</span>
                )}
              </div>

              <div className="space-y-1.5 my-1">
                {BRAZIL_MAP_GRID.map((row, rIdx) => (
                  <div key={rIdx} className="flex gap-1.5 justify-center">
                    {row.map((ufCode, cIdx) => {
                      if (!ufCode) {
                        return <div key={cIdx} className="w-8 h-8 sm:w-9 sm:h-9" />;
                      }
                      const val = ufsMap[ufCode] || 0;
                      const bg = val > 0 ? getHeatColor(val, minVal, maxVal, 0.92) : '#1f2937';
                      const border = val > 0 ? getHeatColor(val, minVal, maxVal, 1) : '#374151';
                      const textColor = getHeatTextColor(val, minVal, maxVal);
                      const isHovered = hoveredUf === ufCode;

                      return (
                        <div
                          key={ufCode}
                          onMouseEnter={() => setHoveredUf(ufCode)}
                          onMouseLeave={() => setHoveredUf(null)}
                          style={{ backgroundColor: bg, borderColor: border, color: textColor }}
                          className={`w-8 h-8 sm:w-9 sm:h-9 rounded-md flex items-center justify-center font-mono font-bold text-xs cursor-pointer border transition-all duration-150 select-none shadow-sm ${
                            isHovered ? 'scale-125 z-20 ring-2 ring-white shadow-lg' : 'hover:scale-110 z-10'
                          }`}
                        >
                          {ufCode}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>

            {/* Gráfico de Barras com Gradiente de Calor */}
            <div className="lg:col-span-7">
              <ChartCanvas
                type="bar"
                id="chart-vg-heatmap"
                height={320}
                data={{
                  labels: ufsData.map(d => d.uf),
                  datasets: [{
                    label: 'Volume Total (R$)',
                    data: ufsData.map(d => d.total),
                    backgroundColor: ufsData.map(d => getHeatColor(d.total, minVal, maxVal, 0.88)),
                    borderColor: ufsData.map(d => getHeatColor(d.total, minVal, maxVal, 1)),
                    borderWidth: 1,
                    borderRadius: 4,
                  }]
                }}
                options={{
                  plugins: {
                    legend: { display: false },
                    tooltip: {
                      callbacks: {
                        label: function(context) {
                          const val = context.raw || 0;
                          const pct = sumVal > 0 ? ((val / sumVal) * 100).toFixed(1) : '0.0';
                          return `Volume: ${formatMoeda(val)} (${pct}%)`;
                        }
                      }
                    }
                  },
                  scales: {
                    x: {
                      ticks: { color: '#9ca3af', font: { size: 10, weight: 'bold' }, autoSkip: false },
                      grid: { display: false }
                    },
                    y: {
                      ticks: {
                        color: '#9ca3af',
                        font: { size: 10 },
                        callback: function(value) {
                          if (value >= 1000000000) return 'R$ ' + (value / 1000000000).toFixed(1) + 'B';
                          if (value >= 1000000) return 'R$ ' + (value / 1000000).toFixed(0) + 'M';
                          if (value >= 1000) return 'R$ ' + (value / 1000).toFixed(0) + 'k';
                          return 'R$ ' + value;
                        }
                      },
                      grid: { color: '#1f2937' }
                    }
                  }
                }}
              />
            </div>
          </div>
        </div>
      );
    }

  const REGIOES = {
    'Norte': ['AC', 'AM', 'AP', 'PA', 'RO', 'RR', 'TO'],
    'Nordeste': ['AL', 'BA', 'CE', 'MA', 'PB', 'PE', 'PI', 'RN', 'SE'],
    'Centro-Oeste': ['DF', 'GO', 'MS', 'MT'],
    'Sudeste': ['ES', 'MG', 'RJ', 'SP'],
    'Sul': ['PR', 'RS', 'SC'],
  };

  const DropdownEstados = ({ uf, setUf, disabled, ufsValidas, isMunicipal }) => {
      const [aberto, setAberto] = React.useState(false);

      const toggleUf = (estado) => {
        if (isMunicipal && estado === "DF") return;
        if (estado === "TODAS") {
          setUf(["TODAS"]);
          setAberto(false);
          return;
        }
        // Remove "TODAS" se o usuário clicar em um estado específico
        let novaLista = uf.filter(u => u !== "TODAS");
        
        if (novaLista.includes(estado)) {
          novaLista = novaLista.filter(u => u !== estado);
          if (novaLista.length === 0) novaLista = ["TODAS"]; // Volta pro padrão se esvaziar
        } else {
          novaLista.push(estado);
        }
        setUf(novaLista);
      };

      const selecionarRegiao = (nomeRegiao) => {
        let ufsRegiao = (REGIOES[nomeRegiao] || []).filter(e => ufsValidas.includes(e));
        if (isMunicipal) {
          ufsRegiao = ufsRegiao.filter(e => e !== "DF");
        }
        setUf(ufsRegiao.length > 0 ? ufsRegiao : ["TODAS"]);
      };

      return (
        <div className="relative">
          <label className={`text-xs uppercase font-bold tracking-wider block mb-1 ${disabled ? 'text-slate-600' : 'text-blue-300'}`}>
            Estado (UF)
          </label>
          <div 
            onClick={() => !disabled && setAberto(!aberto)}
            className={`w-full bg-[#0f172a] border border-blue-500/50 rounded-lg px-3 py-2 text-sm text-white flex justify-between items-center cursor-pointer transition-colors ${disabled ? 'opacity-50 cursor-not-allowed bg-slate-800 border-slate-700' : 'hover:border-blue-400'}`}
          >
            <span className="truncate">{uf.includes("TODAS") ? "Todas as UFs" : uf.join(", ")}</span>
            <span className="text-blue-400 text-xs">{aberto ? '▲' : '▼'}</span>
          </div>
          
          {aberto && !disabled && (
            <div className="absolute z-50 w-full mt-2 bg-[#1e293b] border border-blue-500/30 rounded-lg shadow-2xl p-3">
              <div 
                onClick={() => toggleUf("TODAS")}
                className={`px-3 py-1.5 rounded-md cursor-pointer text-xs font-bold text-center mb-2.5 transition-colors ${uf.includes("TODAS") ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
              >
                Todas as UFs do Brasil
              </div>

              {/* Botões de Seleção Rápida por Região */}
              <div className="mb-2.5">
                <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Regiões:</span>
                <div className="grid grid-cols-3 gap-1">
                  {Object.keys(REGIOES).map(reg => (
                    <button
                      key={reg}
                      type="button"
                      onClick={(e) => { e.stopPropagation(); selecionarRegiao(reg); }}
                      className="px-1.5 py-1 text-[10px] font-semibold rounded bg-slate-800 text-slate-300 hover:bg-blue-600 hover:text-white transition-colors border border-slate-700 truncate"
                      title={`Selecionar estados do ${reg}`}
                    >
                      {reg}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-4 gap-1.5 border-t border-slate-600 pt-2.5">
                {ufsValidas.map(estado => {
                  const isDfBloqueado = isMunicipal && estado === "DF";
                  return (
                    <div 
                      key={estado}
                      onClick={() => !isDfBloqueado && toggleUf(estado)}
                      title={isDfBloqueado ? "DF não possui eleições municipais (Art. 32 CF/88)" : estado}
                      className={`px-1 py-1.5 rounded text-center text-xs font-semibold transition-transform ${
                        isDfBloqueado
                          ? 'opacity-30 cursor-not-allowed bg-[#0f172a] text-slate-600 border border-slate-800'
                          : uf.includes(estado)
                            ? 'bg-emerald-500 text-white shadow-md cursor-pointer active:scale-95'
                            : 'bg-[#0f172a] text-slate-400 border border-slate-700 hover:bg-slate-600 hover:text-white cursor-pointer active:scale-95'
                      }`}
                    >
                      {estado}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    };

  const DropdownPartidos = ({ partido, setPartido, partidosValidos }) => {
    const [aberto, setAberto] = React.useState(false);
    const [busca, setBusca] = React.useState("");

    const togglePartido = (p) => {
      if (p === "TODOS") {
        setPartido(["TODOS"]);
        setAberto(false);
        return;
      }
      let novaLista = Array.isArray(partido) ? partido.filter(x => x !== "TODOS") : [];
      if (novaLista.includes(p)) {
        novaLista = novaLista.filter(x => x !== p);
        if (novaLista.length === 0) novaLista = ["TODOS"];
      } else {
        novaLista.push(p);
      }
      setPartido(novaLista);
    };

    const partidosFiltrados = (partidosValidos || []).filter(p => 
      p.toUpperCase().includes(busca.toUpperCase().trim())
    );

    let labelExibicao = "Todos os Partidos";
    if (Array.isArray(partido) && !partido.includes("TODOS")) {
      if (partido.length <= 3) {
        labelExibicao = partido.join(", ");
      } else {
        labelExibicao = `${partido.length} partidos selecionados`;
      }
    } else if (typeof partido === "string" && partido !== "TODOS") {
      labelExibicao = partido;
    }

    return (
      <div className="relative">
        <label className="text-xs uppercase font-bold text-blue-300 tracking-wider block mb-1">
          Legenda Partidária
        </label>
        <div 
          onClick={() => setAberto(!aberto)}
          className="w-full bg-[#0f172a] border border-blue-500/50 rounded-lg px-3 py-2 text-sm text-white flex justify-between items-center cursor-pointer transition-colors hover:border-blue-400"
        >
          <span className="truncate">{labelExibicao}</span>
          <span className="text-blue-400 text-xs">{aberto ? '▲' : '▼'}</span>
        </div>
        
        {aberto && (
          <div className="absolute z-50 w-80 sm:w-[350px] mt-2 bg-[#1e293b] border border-blue-500/30 rounded-lg shadow-2xl p-3">
            <div 
              onClick={() => togglePartido("TODOS")}

                            <span className="bg-gray-800 px-2.5 py-1 rounded-md border border-gray-600 text-xs font-bold uppercase text-gray-300 shadow-sm">
                              <span className="text-gray-500 mr-1">Partido:</span>{cand.partido}
                            </span>
                            <span className="bg-gray-800 px-2.5 py-1 rounded-md border border-gray-600 text-xs font-bold uppercase text-gray-300 shadow-sm">
                              <span className="text-gray-500 mr-1">Cargo:</span>{cand.cargo}
                            </span>
                            <span className="bg-gray-800 px-2.5 py-1 rounded-md border border-gray-600 text-xs font-bold uppercase text-gray-300 shadow-sm">
                              <span className="text-gray-500 mr-1">UF:</span>{cand.uf}
                            </span>
                          </div>

                          <div className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">
                            Principais Doadores ({cand.doadores.length} origens)
                          </div>
                          {cand.doadores.length === 0 ? (
                            <div className="py-4 px-3 text-center bg-gray-900/60 rounded border border-gray-800 text-xs text-gray-400">
                              Nenhuma receita financeira positiva registrada para esta candidatura (Declaração sem movimentação financeira / R$ 0,00).
                            </div>
                          ) : (
                            <table className="w-full text-xs text-gray-300">
                              <tbody className="divide-y divide-gray-800/50">
                                {cand.doadores.slice(0, 50).map((d, i) => (
                                  <tr key={i} className="hover:bg-gray-800/40 transition-colors">
                                    <td className="py-2.5">
                                      <div className="flex items-center justify-between gap-2 min-w-0" title={d.doador}>
                                        <span className="truncate font-medium text-slate-200">{d.doador}</span>
                                        <span className="shrink-0 bg-slate-800 text-amber-300 font-mono text-[10px] font-bold px-1.5 py-0.5 rounded border border-slate-700" title={`UF do Doador: ${d.uf && d.uf !== '-' ? d.uf : 'Não informada no TSE'}`}>
                                          {d.uf && d.uf !== '-' ? d.uf : 'N/I'}
                                        </span>
                                      </div>
                                    </td>
                                    <td className="py-2.5 text-right text-blue-400 font-semibold font-mono">{formatMoeda(d.valor)}</td>
                                  </tr>
                                ))}
                                {cand.doadores.length > 50 && (
                                  <tr className="bg-[#0f172a]/40">
                                    <td colSpan="2" className="py-3 text-center text-xs text-gray-500 font-medium italic border-t border-gray-800/50">
                                      ... e mais {formatNumero(cand.doadores.length - 50)} origens menores ocultadas.
                                    </td>
                                  </tr>
                                )}
                              </tbody>
                            </table>
                          )}
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  };

    function App() {
      // Metadados e Filtros
      const [modoRecurso, setModoRecurso] = useState('privado'); // Inicialização padrão: 'Somente Doações'
      const apenasPrivado = modoRecurso !== 'todos';
      const [meta, setMeta] = useState(null);
      const [ano, setAno] = useState(ANOS_PADRAO[0]);
      const [cargo, setCargo] = useState("TODOS");
      const [uf, setUf] = useState(["TODAS"]);
      const [partido, setPartido] = useState(["TODOS"]);
      const [municipio, setMunicipio] = useState("TODOS");

      // Seção Ativa (Mostrar 1 por vez)
      const [activeTab, setActiveTab] = useState("visao-geral");
      const [subTabTeia, setSubTabTeia] = useState("setores"); // 'setores' | 'empresas' | 'socios' | 'todas'

      // Resolução de Estado Único para controle de abas e gráficos territoriais
      const ufsValidas = Array.isArray(uf) 
        ? uf.filter(u => u && u.toUpperCase() !== "TODAS")
        : (uf && uf.toUpperCase() !== "TODAS" ? [uf] : []);
      const isEstadoUnico = ufsValidas.length === 1;

      // Se estado único for selecionado manualmente (exceto Deputado Distrital, que possui rotas interestaduais próprias) e a aba ativa for geografia, redireciona para visão geral
      useEffect(() => {
        if (isEstadoUnico && cargo !== 'DEPUTADO DISTRITAL' && activeTab === 'geografia') {
          setActiveTab('visao-geral');
        }
      }, [isEstadoUnico, cargo, activeTab]);

      // Estados de Dados
      const [globalData, setGlobalData] = useState(null);
      const [dynamicData, setDynamicData] = useState(null);
      const [dynamicLoading, setDynamicLoading] = useState(false);
      const [loading, setLoading] = useState(true);

      const handleTabChange = (newTab) => {
        if (newTab !== activeTab) {
          setActiveTab(newTab);
          setDynamicData(null);
          setDynamicLoading(true);
        }
      };

      // Trava de integridade: Presidente = TODAS as UFs; Deputado Distrital = DF; restaura TODAS ao sair de Deputado Distrital
      const prevCargoRef = useRef(cargo);
      useEffect(() => {
        const prevCargo = prevCargoRef.current;
        if (cargo === 'PRESIDENTE') {
          setUf(["TODAS"]);
        } else if (cargo === 'DEPUTADO DISTRITAL') {
          setUf(["DF"]);
        } else if (prevCargo === 'DEPUTADO DISTRITAL' || prevCargo === 'PRESIDENTE') {
          setUf(["TODAS"]);
        }
        prevCargoRef.current = cargo;
      }, [cargo]);

      useEffect(() => {
        // Se UF for selecionada e não incluir DF nem TODAS, e cargo for DEPUTADO DISTRITAL, reseta cargo
        if (Array.isArray(uf) && !uf.includes("TODAS") && !uf.includes("DF") && cargo === "DEPUTADO DISTRITAL") {
          setCargo("TODOS");
        }
      }, [uf, cargo]);

      // Carrega metadados iniciais e dados globais (adaptado ao interruptor de 3 fases)
      useEffect(() => {
        Promise.all([
          fetch('/api/meta/filtros').then(r => r.json()),
          fetch(`/api/global?modo_recurso=${modoRecurso}`).then(r => r.json())
        ]).then(([metaRes, globRes]) => {
          setMeta(metaRes);
          setGlobalData(globRes);
          setLoading(false);
        }).catch(err => console.error("Erro ao carregar dados iniciais:", err));
      }, [modoRecurso]);

      // Atualiza cargos disponíveis quando ano muda (Travas 2018/2022 vs 2020/2024 e Trava DF)
      useEffect(() => {
        if (!meta) return;
        const isMunicipalYear = String(ano).includes('2020') || String(ano).includes('2024');
        const anoBase = isMunicipalYear ? 2020 : 2022;
        const cargosValidosList = meta.cargos_por_ano?.[anoBase] || CARGOS_PADRAO[anoBase] || [];
        if (cargo !== "TODOS" && !cargosValidosList.includes(cargo) && cargo !== "DEPUTADO DISTRITAL") {
          setCargo("TODOS");
        }
        // Desativa município se for eleição geral
        if (!isMunicipalYear) {
          setMunicipio("TODOS");
        }
        // Trava DF: Oculta/remove DF em eleições municipais (Art. 32 CF/88)
        if (isMunicipalYear && Array.isArray(uf) && uf.includes("DF")) {
          const ufsSemDf = uf.filter(u => u !== "DF");
          setUf(ufsSemDf.length > 0 ? ufsSemDf : ["TODAS"]);
        }
      }, [ano, meta]);

      // Carrega dados da seção dinâmica ativa com cancelamento de requisições obsoletas
      useEffect(() => {
        if (!meta) return;
        let isCancelled = false;
        setDynamicLoading(true);

        const timer = setTimeout(() => {
          let url = '';
          const params = new URLSearchParams();
        
          params.append("ano", ano);
          if (cargo && cargo !== "TODOS") params.append("cargo", cargo);
          
          if (Array.isArray(uf)){
            const UFsvalidas = uf.filter(u => u !== "TODAS")
            if (UFsvalidas.length > 0) {
              params.append("uf", UFsvalidas.join(","));
            }
          } else if (uf && uf !== "TODAS") {
            params.append("uf", uf);
          }

          if (Array.isArray(partido)) {
            const partidosValidos = partido.filter(p => p !== "TODOS");
            if (partidosValidos.length > 0) {
              params.append("partido", partidosValidos.join(","));
            }
          } else if (partido && partido !== "TODOS") {
            params.append("partido", partido);
          }
          if (municipio && municipio !== "TODOS") params.append("municipio", municipio);

          params.append("modo_recurso", modoRecurso);
          params.append("apenas_privado", apenasPrivado);

          const currentTab = activeTab;

          if (currentTab === "visao-geral") {
            url = `/api/visao-geral?${params.toString()}`;
          } else if (currentTab === "geografia") {
            url = `/api/geografia?${params.toString()}`;
          } else if (currentTab === "custo-do-voto") {
            if (!cargo || cargo === "TODOS") {
              if (!isCancelled) {
                setDynamicData(null);
                setDynamicLoading(false);
              }
              return;
            }
            url = `/api/custo-do-voto?${params.toString()}`;
          } else if (currentTab === "teia-empresarial") {
            url = `/api/teia-empresarial?${params.toString()}`;
          } else if (currentTab === "origem-autofinanciamento") {
            url = `/api/origem-autofinanciamento?${params.toString()}`;
          }

          if (url) {
            setDynamicLoading(true);
            fetch(url)
              .then(r => {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
              })
              .then(data => {
                if (!isCancelled) {
                  setDynamicData({ tab: currentTab, ...data });
                  setDynamicLoading(false);
                }
              })
              .catch(err => {
                if (!isCancelled) {
                  console.error("Erro ao carregar seção dinâmica:", err);
                  setDynamicLoading(false);
                }
              });
          }
        }, 300); // Debounce de 300ms
        
        return () => {
          isCancelled = true;
          clearTimeout(timer);
        };

      }, [activeTab, ano, cargo, uf, partido, municipio, meta, modoRecurso]);

      if (loading || !globalData) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-[#0b0f19]">
            <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      const anoBase = String(ano).includes('2020') || String(ano).includes('2024') ? 2020 : 2022;
      const isGeralYear = !String(ano).includes('2020') && !String(ano).includes('2024');
      const rawCargos = (meta?.cargos_por_ano && Array.isArray(meta.cargos_por_ano[anoBase]) && meta.cargos_por_ano[anoBase].length) ? meta.cargos_por_ano[anoBase] : (CARGOS_PADRAO[anoBase] || []);
      const cargosValidos = [...rawCargos];
      if (isGeralYear && !cargosValidos.includes("DEPUTADO DISTRITAL")) {
        cargosValidos.splice(2, 0, "DEPUTADO DISTRITAL");
      }

      return (
        <div className="w-full max-w-7xl xl:max-w-[1400px] 2xl:max-w-[1536px] mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
          <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-gray-800 pb-4 mb-6 gap-4">
            <div className="flex items-center space-x-3">
              <div className="w-3 h-8 bg-blue-500 rounded-sm"></div>
              <div>
                <h1 className="text-xl md:text-2xl font-black tracking-wider text-white uppercase">PACD — PAINEL DE FINANCIAMENTO ELEITORAL</h1>
                <span className="text-xs text-blue-400 font-mono tracking-widest uppercase">BASE ELEITORAL BRASILEIRA 2018–2024</span>
              </div>
            </div>
            {/* INTERRUPTOR GLOBAL EM 3 FASES */}
            <div className="flex items-center space-x-2 bg-[#0f172a] border border-blue-500/40 rounded-lg p-1.5 shadow-lg">
              <span className="text-xs font-bold uppercase tracking-wider text-blue-300 ml-2 mr-1">Origem dos Recursos:</span>
              <div className="flex bg-gray-900/90 rounded-md p-0.5 border border-gray-700/60">
                <button
                  type="button"
                  onClick={() => setModoRecurso('todos')}
                  className={`px-3 py-1.5 text-xs font-bold rounded transition-all cursor-pointer ${
                    modoRecurso === 'todos'
                      ? 'bg-blue-600 text-white shadow-md'
                      : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  Todos os Recursos
                </button>
                <button
                  type="button"
                  onClick={() => setModoRecurso('privado')}
                  className={`px-3 py-1.5 text-xs font-bold rounded transition-all cursor-pointer ${
                    modoRecurso === 'privado'
                      ? 'bg-emerald-600 text-white shadow-md'
                      : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  Somente Doações
                </button>
                <button
                  type="button"
                  onClick={() => setModoRecurso('elite')}
                  className={`px-3 py-1.5 text-xs font-bold rounded transition-all cursor-pointer ${
                    modoRecurso === 'elite'
                      ? 'bg-purple-600 text-white shadow-md'
                      : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  Elite Empresarial
                </button>
              </div>
            </div>
          </header>
          
          {/* ================================================================= */}
          {/* 1. BLOCO FIXO GLOBAL: "TUDO E TODOS" (IMUNE A FILTROS)            */}
          {/* ================================================================= */}
          <div className="bg-[#111827] border border-gray-800 rounded-xl p-5 shadow-2xl space-y-6">
            
            {/* 4 KPIs Globais */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Volume Financeiro Ativo</span>
                <span className="text-2xl font-bold text-blue-400 mt-1 block font-mono">{formatMoeda(globalData.kpis.volume_financeiro_ativo)}</span>
              </div>
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Candidaturas no Recorte</span>
                <span className="text-2xl font-bold text-emerald-400 mt-1 block font-mono">{formatNumero(globalData.kpis.candidaturas_no_recorte)}</span>
              </div>
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Doadores no Recorte</span>
                <span className="text-2xl font-bold text-amber-400 mt-1 block font-mono">{formatNumero(globalData.kpis.doadores_no_recorte)}</span>
              </div>
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Transações Registradas</span>
                <span className="text-2xl font-bold text-purple-400 mt-1 block font-mono">{formatNumero(globalData.kpis.transacoes_registradas)}</span>
              </div>
            </div>

            {/* 4 Gráficos Globais */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              
              {/* Gráfico 1: Ranking de Doadores (Tabela Expansível - BLOCO GLOBAL FIXO) */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg flex flex-col h-full">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide flex justify-between items-center">
                  Ranking de Maiores Doadores Globais
                  <span className="text-[10px] font-normal text-gray-500 bg-gray-800 px-2 py-0.5 rounded">Clique na linha para expandir</span>
                </h3>
                <div className="flex-1">
                  <TabelaTopDoadoresExpandivel doadores={globalData?.graficos?.top_10_doadores || []} />
                </div>
              </div>

              {/* Gráfico 2: Ranking de Candidatos Mais Financiados */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg flex flex-col h-full">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide flex justify-between items-center">
                  Ranking de Candidatos Mais Financiados
                  <span className="text-[10px] font-normal text-gray-500 bg-gray-800 px-2 py-0.5 rounded">Clique para auditar origem</span>
                </h3>
                <div className="flex-1">
                  <TabelaTopCandidatosExpandivel candidatos={globalData?.graficos?.top_10_candidatos || []} />
                </div>
              </div>

              {/* Gráfico 3: Distribuição do Volume Arrecadado (Escala Logarítmica) */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Distribuição do Volume Arrecadado (Escala Logarítmica)</h3>
                <ChartCanvas
                  type="bar"
                  id="chart-global-dist-log"
                  data={{
                    labels: globalData.graficos.distribuicao_log.map(d => d.faixa_reais),
                    datasets: [{
                      label: 'Candidaturas',
                      data: globalData.graficos.distribuicao_log.map(d => d.contagem),
                      backgroundColor: '#6366f1',
                      borderRadius: 4,
                    }]
                  }}
                />
              </div>

              {/* Gráfico 4: Autofinanciamento: Os Maiores Investidores da Própria Campanha */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Autofinanciamento: Maiores Investidores da Própria Campanha</h3>
                <ChartCanvas
                  type="bar"
                  id="chart-global-auto"
                  data={{
                    labels: globalData.graficos.top_autofinanciamento.map(d => `${d.nome.substring(0, 18)} (${d.partido})`),
                    datasets: [{
                      label: 'Aporte Próprio (R$)',
                      data: globalData.graficos.top_autofinanciamento.map(d => d.total_proprio),
                      backgroundColor: '#f59e0b',
                      borderRadius: 4,
                    }]
                  }}
                  options={{ indexAxis: 'y' }}
                />
              </div>

              {/* Gráfico 5: Ranking de Partidos em Volume Financeiro */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Ranking de Partidos em Volume Financeiro</h3>
                <ChartCanvas
                  type="bar"
                  id="chart-global-partidos"
                  data={{
                    labels: (globalData?.graficos?.top_10_partidos || []).map(d => d.partido),
                    datasets: [{
                      label: 'Volume Total (R$)',
                      data: (globalData?.graficos?.top_10_partidos || []).map(d => d.total),
                      backgroundColor: '#10b981',
                      borderRadius: 4,
                    }]
                  }}
                  options={{ indexAxis: 'y' }}
                />
              </div>

              {/* Gráfico 6: Ranking Federativo Global (Top Estados) */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Ranking Federativo (Top Estados)</h3>
                <ChartCanvas
                  type="bar"
                  id="chart-global-ranking-estados"
                  data={{
                    labels: (globalData?.graficos?.ranking_estados || []).map(d => d.uf),
                    datasets: [{
                      label: 'Volume Total (R$)',
                      data: (globalData?.graficos?.ranking_estados || []).map(d => d.total),
                      backgroundColor: '#3b82f6',
                      borderRadius: 4,
                    }]
                  }}
                  options={{ indexAxis: 'y' }}
                />
              </div>

            </div>
          </div>


          {/* ================================================================= */}
          {/* 2. BARRA DE FILTROS (ALTO CONTRASTE VISUAL)                        */}
          {/* ================================================================= */}
          <div className="bg-[#182235] border-2 border-blue-500/80 rounded-xl p-4 shadow-xl">
            <h2 className="text-sm md:text-base font-black uppercase tracking-widest text-blue-300 mb-3">Filtros</h2>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              
              {/* Filtro: Ano (Exclusivo, não acumular) */}
              <div>
                <label className="text-xs uppercase font-bold text-blue-300 tracking-wider block mb-1">Ano Eleitoral</label>
                <select
                  value={ano}
                  onChange={e => {
                    setDynamicData(null);
                    setDynamicLoading(true);
                    setAno(e.target.value);
                  }}
                  className="w-full bg-[#0f172a] border border-blue-500/50 rounded-lg px-3 py-2 text-sm text-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                  <optgroup label="Eleições Individuais">
                    <option value="2018">2018 (Geral)</option>
                    <option value="2020">2020 (Municipal)</option>
                    <option value="2022">2022 (Geral)</option>
                    <option value="2024">2024 (Municipal)</option>
                  </optgroup>
                  <optgroup label="Ciclos Eleitorais Agrupados">
                    <option value="2018,2022">2018 + 2022 (Ciclo Geral Consolidado)</option>
                    <option value="2020,2024">2020 + 2024 (Ciclo Municipal Consolidado)</option>
                  </optgroup>
                </select>
              </div>

              {/* Filtro: Cargo (Travas Eleitorais 2018/2022 vs 2020/2024 e Trava DF) */}
              <div>
                <label className="text-xs uppercase font-bold text-blue-300 tracking-wider block mb-1">Cargo em Disputa</label>
                <select
                  value={cargo}
                  onChange={e => {
                    setDynamicData(null);
                    setDynamicLoading(true);
                    setCargo(e.target.value);
                  }}
                  className="w-full bg-[#0f172a] border border-blue-500/50 rounded-lg px-3 py-2 text-sm text-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                  <option value="TODOS">Todos os Cargos</option>
                  {cargosValidos.filter(c => {
                    if (c === "TODOS") return false;
                    // Trava DF: Oculta DEPUTADO DISTRITAL se o usuário filtrou UFs sem o DF
                    if (c === "DEPUTADO DISTRITAL" && Array.isArray(uf) && !uf.includes("TODAS") && !uf.includes("DF")) {
                      return false;
                    }
                    // Trava DF: Oculta PREFEITO e VEREADOR se o DF for selecionado exclusivamente
                    if ((c === "PREFEITO" || c === "VEREADOR") && Array.isArray(uf) && uf.length === 1 && uf.includes("DF")) {
                      return false;
                    }
                    return true;
                  }).map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              {/* Filtro: UF */}
              <div>
                <DropdownEstados 
                  uf={uf} 
                  setUf={setUf} 
                  disabled={cargo === 'PRESIDENTE' || cargo === 'DEPUTADO DISTRITAL'} 
                  ufsValidas={meta?.ufs || []} 
                  isMunicipal={String(ano).includes('2020') || String(ano).includes('2024')}
                />
              </div>

              {/* Filtro: Partido (Multi-seleção com Busca Rápida) */}
              <div>
                <DropdownPartidos 
                  partido={partido} 
                  setPartido={setPartido} 
                  partidosValidos={meta?.partidos && meta.partidos.length ? meta.partidos : PARTIDOS_PADRAO} 
                />
              </div>

              {/* {Filtro: Município (Desativado)}
              <div>
                <label className="text-xs uppercase font-bold text-blue-300 tracking-wider block mb-1">Município</label>
                <select
                  value={municipio}
                  disabled={isGeralYear}
                  onChange={e => {
                    setDynamicData(null);
                    setDynamicLoading(true);
