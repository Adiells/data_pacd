<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PACD - Painel Eleitoral</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            accent: {
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e',
              indigo: '#6366f1',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary detectou erro:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex flex-col items-center justify-center p-12 text-center bg-[#111827] border border-gray-800 rounded-xl my-4">
              <div className="w-12 h-12 mb-3 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold text-xl">!</div>
              <button
                type="button"
                onClick={() => this.setState({ hasError: false })}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-semibold transition"
              >
                Recarregar Painel
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function formatMoeda(val) {
      if (val === undefined || val === null || isNaN(val)) return "R$ 0,00";
      return "R$ " + Number(val).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatNumero(val) {
      if (val === undefined || val === null || isNaN(val)) return "0";
      return Number(val).toLocaleString("pt-BR");
    }

    function ChartCanvas({ type, data, options, id }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
          chartInstanceRef.current = null;
        }

        try {
          const ctx = canvasRef.current.getContext('2d');
          chartInstanceRef.current = new Chart(ctx, {
            type: type || 'bar',
            data: data,
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: { color: '#9ca3af', font: { size: 11 } }
                },
                tooltip: {
                  backgroundColor: '#1f2937',
                  titleColor: '#f9fafb',
                  bodyColor: '#e5e7eb',
                  borderColor: '#374151',
                  borderWidth: 1,
                }
              },
              scales: {
                x: {
                  ticks: { color: '#9ca3af', font: { size: 10 } },
                  grid: { color: '#1f2937' }
                },
                y: {
                  ticks: { color: '#9ca3af', font: { size: 10 } },
                  grid: { color: '#1f2937' }
                }
              },
              ...options
            }
          });
        } catch (err) {
          console.error("Erro ao inicializar Chart.js:", id, err);
        }

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }
        };
      }, [data, options, type]);

      return (
        <div className="chart-container">
          <canvas ref={canvasRef} id={id}></canvas>
        </div>
      );
    }

    const NOMES_UFS = {
      AC: "Acre", AL: "Alagoas", AP: "Amapá", AM: "Amazonas", BA: "Bahia",
      CE: "Ceará", DF: "Distrito Federal", ES: "Espírito Santo", GO: "Goiás",
      MA: "Maranhão", MT: "Mato Grosso", MS: "Mato Grosso do Sul", MG: "Minas Gerais",
      PA: "Pará", PB: "Paraíba", PR: "Paraná", PE: "Pernambuco", PI: "Piauí",
      RJ: "Rio de Janeiro", RN: "Rio Grande do Norte", RS: "Rio Grande do Sul",
      RO: "Rondônia", RR: "Roraima", SC: "Santa Catarina", SP: "São Paulo",
      SE: "Sergipe", TO: "Tocantins"
    };

    const BRAZIL_MAP_GRID = [
      [null, null, 'RR', null, 'AP', null, null, null],
      [null, 'AM', 'PA', 'MA', 'CE', 'RN', null, null],
      ['AC', 'RO', 'TO', 'PI', 'PB', 'PE', null, null],
      [null, 'MT', 'GO', 'DF', 'BA', 'AL', 'SE', null],
      [null, 'MS', 'MG', 'ES', null, null, null, null],
      [null, null, 'SP', 'RJ', null, null, null, null],
      [null, 'PR', 'SC', null, null, null, null, null],
      [null, 'RS', null, null, null, null, null, null],
    ];

    const ANOS_PADRAO = [2024, 2022, 2020, 2018];
    const CARGOS_PADRAO = {
      2018: ["DEPUTADO FEDERAL", "DEPUTADO ESTADUAL", "DEPUTADO DISTRITAL", "SENADOR", "GOVERNADOR", "PRESIDENTE"],
      2022: ["DEPUTADO FEDERAL", "DEPUTADO ESTADUAL", "DEPUTADO DISTRITAL", "SENADOR", "GOVERNADOR", "PRESIDENTE"],
      2020: ["PREFEITO", "VEREADOR"],
      2024: ["PREFEITO", "VEREADOR"]
    };
    const UFS_PADRAO = [
      "AC", "AL", "AM", "AP", "BA", "CE", "DF", "ES", "GO", "MA", "MG", "MS", "MT",
      "PA", "PB", "PE", "PI", "PR", "RJ", "RN", "RO", "RR", "RS", "SC", "SE", "SP", "TO"
    ];
    const PARTIDOS_PADRAO = [
      "AVANTE", "CIDADANIA", "MDB", "NOVO", "PATRIOTA", "PC do B", "PDT", "PL",
      "PODE", "PP", "PRD", "PROS", "PRTB", "PSB", "PSC", "PSD", "PSDB", "PSOL",
      "PSTU", "PT", "PTB", "PV", "REDE", "REPUBLICANOS", "SOLIDARIEDADE", "UNIÃO"
    ];

    function getHeatColor(val, min, max, alpha = 1) {
      if (val === undefined || val === null || isNaN(val) || val <= 0) {
        return `rgba(31, 41, 55, ${alpha})`;
      }
      const t = max > min ? Math.max(0, Math.min(1, (val - min) / (max - min))) : 0.5;
      let r, g, b;
      if (t < 0.25) {
        const s = t / 0.25;
        r = Math.round(254 + (253 - 254) * s);
        g = Math.round(240 + (224 - 240) * s);
        b = Math.round(138 + (71 - 138) * s);
      } else if (t < 0.5) {
        const s = (t - 0.25) / 0.25;
        r = Math.round(253 + (249 - 253) * s);
        g = Math.round(224 + (115 - 224) * s);
        b = Math.round(71 + (22 - 71) * s);
      } else if (t < 0.75) {
        const s = (t - 0.5) / 0.25;
        r = Math.round(249 + (239 - 249) * s);
        g = Math.round(115 + (68 - 115) * s);
        b = Math.round(22 + (68 - 22) * s);
      } else {
        const s = (t - 0.75) / 0.25;
        r = Math.round(239 + (153 - 239) * s);
        g = Math.round(68 + (27 - 68) * s);
        b = Math.round(68 + (27 - 68) * s);
      }
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getHeatTextColor(val, min, max) {
      if (!val || val <= 0) return '#6b7280';
      const t = max > min ? (val - min) / (max - min) : 0;
      return t > 0.4 ? '#ffffff' : '#111827';
    }

    function PanoramaFederativoHeatmap({ data }) {
      const [hoveredUf, setHoveredUf] = useState(null);

      const ufsData = Array.isArray(data) ? data : [];
      const ufsMap = {};
      ufsData.forEach(d => {
        if (d && d.uf) {
          ufsMap[d.uf] = Number(d.total) || 0;
        }
      });

      const totals = ufsData.map(d => Number(d.total) || 0).filter(t => t > 0);
      const minVal = totals.length > 0 ? Math.min(...totals) : 0;
      const maxVal = totals.length > 0 ? Math.max(...totals) : 1;
      const sumVal = ufsData.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0);

      const topUf = ufsData.length > 0 ? ufsData[0] : null;
      const activeUf = hoveredUf || (topUf ? topUf.uf : null);
      const activeTotal = activeUf ? (ufsMap[activeUf] || 0) : 0;
      const activePct = sumVal > 0 ? ((activeTotal / sumVal) * 100).toFixed(1) : "0.0";

      return (
        <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg lg:col-span-2 space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-gray-800 gap-2">
            <h3 className="text-sm font-semibold text-gray-300 tracking-wide">
              Panorama Federativo e Mapa de Calor do Brasil (Heatmap)
            </h3>
            <div className="flex items-center space-x-2 text-xs">
              <span className="text-gray-400 font-medium">{formatMoeda(minVal)}</span>
              <div className="w-24 sm:w-36 h-2.5 rounded-full bg-gradient-to-r from-[#fef08a] via-[#fb923c] via-[#ef4444] to-[#991b1b] border border-gray-700"></div>
              <span className="text-gray-400 font-medium">{formatMoeda(maxVal)}</span>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
            {/* Mapa de Calor Cartográfico (Grid 8x8) */}
            <div className="lg:col-span-5 flex flex-col items-center justify-center p-2 bg-[#111827]/40 rounded-lg border border-gray-800/60">
              <div className="h-6 mb-2 flex items-center justify-center text-xs font-semibold">
                {activeUf ? (
                  <span className="text-blue-300">
                    {activeUf} - {NOMES_UFS[activeUf] || activeUf}: {formatMoeda(activeTotal)} ({activePct}%)
                  </span>
                ) : null}
              </div>
              <div className="space-y-1">
                {BRAZIL_MAP_GRID.map((row, rIdx) => (
                  <div key={rIdx} className="flex gap-1 justify-center">
                    {row.map((ufCode, cIdx) => {
                      if (!ufCode) {
                        return <div key={cIdx} className="w-7 h-7 sm:w-8 sm:h-8" />;
                      }
                      const val = ufsMap[ufCode] || 0;
                      const bg = val > 0 ? getHeatColor(val, minVal, maxVal, 0.9) : '#1f2937';
                      const border = val > 0 ? getHeatColor(val, minVal, maxVal, 1) : '#374151';
                      const textColor = getHeatTextColor(val, minVal, maxVal);
                      const isHovered = hoveredUf === ufCode;

                      return (
                        <div
                          key={ufCode}
                          onMouseEnter={() => setHoveredUf(ufCode)}
                          onMouseLeave={() => setHoveredUf(null)}
                          style={{ backgroundColor: bg, borderColor: border, color: textColor }}
                          className={`w-7 h-7 sm:w-8 sm:h-8 rounded flex items-center justify-center font-bold text-[11px] cursor-pointer border transition-all duration-150 select-none shadow-sm ${
                            isHovered ? 'scale-125 z-20 ring-2 ring-white shadow-lg' : 'hover:scale-110 z-10'
                          }`}
                        >
                          {ufCode}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>

            {/* Gráfico de Barras com Gradiente de Calor */}
            <div className="lg:col-span-7">
              <ChartCanvas
                type="bar"
                id="chart-vg-heatmap"
                data={{
                  labels: ufsData.map(d => d.uf),
                  datasets: [{
                    label: 'Volume Total (R$)',
                    data: ufsData.map(d => d.total),
                    backgroundColor: ufsData.map(d => getHeatColor(d.total, minVal, maxVal, 0.85)),
                    borderColor: ufsData.map(d => getHeatColor(d.total, minVal, maxVal, 1)),
                    borderWidth: 1,
                    borderRadius: 4,
                  }]
                }}
                options={{
                  plugins: {
                    legend: { display: false },
                    tooltip: {
                      callbacks: {
                        label: function(context) {
                          const val = context.raw || 0;
                          const pct = sumVal > 0 ? ((val / sumVal) * 100).toFixed(1) : '0.0';
                          return `Volume: ${formatMoeda(val)} (${pct}%)`;
                        }
                      }
                    }
                  },
                  scales: {
                    x: {
                      ticks: { color: '#9ca3af', font: { size: 10 } },
                      grid: { display: false }
                    },
                    y: {
                      ticks: {
                        color: '#9ca3af',
                        font: { size: 10 },
                        callback: function(value) {
                          if (value >= 1000000000) return 'R$ ' + (value / 1000000000).toFixed(1) + 'B';
                          if (value >= 1000000) return 'R$ ' + (value / 1000000).toFixed(0) + 'M';
                          if (value >= 1000) return 'R$ ' + (value / 1000).toFixed(0) + 'k';
                          return 'R$ ' + value;
                        }
                      },
                      grid: { color: '#1f2937' }
                    }
                  }
                }}
              />
            </div>
          </div>
        </div>
      );
    }

    function App() {
      // Metadados e Filtros
      const [meta, setMeta] = useState(null);
      const [ano, setAno] = useState(ANOS_PADRAO[0]);
      const [cargo, setCargo] = useState("TODOS");
      const [uf, setUf] = useState("TODAS");
      const [partido, setPartido] = useState("TODOS");
      const [municipio, setMunicipio] = useState("TODOS");

      // Seção Ativa (Mostrar 1 por vez)
      const [activeTab, setActiveTab] = useState("visao-geral");

      // Estados de Dados
      const [globalData, setGlobalData] = useState(null);
      const [dynamicData, setDynamicData] = useState(null);
      const [dynamicLoading, setDynamicLoading] = useState(false);
      const [loading, setLoading] = useState(true);

      const handleTabChange = (newTab) => {
        if (newTab !== activeTab) {
          setActiveTab(newTab);
          setDynamicData(null);
          setDynamicLoading(true);
        }
      };

      // Carrega metadados iniciais e dados globais
      useEffect(() => {
        Promise.all([
          fetch('/api/meta/filtros').then(r => r.json()),
          fetch('/api/global').then(r => r.json())
        ]).then(([metaRes, globRes]) => {
          setMeta(metaRes);
          setGlobalData(globRes);
          setLoading(false);
        }).catch(err => console.error("Erro ao carregar dados iniciais:", err));
      }, []);

      // Atualiza cargos disponíveis quando ano muda (Travas 2018/2022 vs 2020/2024)
      useEffect(() => {
        if (!meta) return;
        const cargosValidos = meta.cargos_por_ano?.[ano] || CARGOS_PADRAO[ano] || [];
        if (cargo !== "TODOS" && !cargosValidos.includes(cargo)) {
          setCargo("TODOS");
        }
        // Desativa município se for 2018 ou 2022
        if (ano === 2018 || ano === 2022) {
          setMunicipio("TODOS");
        }
      }, [ano, meta]);

      // Carrega dados da seção dinâmica ativa
      useEffect(() => {
        if (!meta) return;
        let url = '';
        const params = new URLSearchParams();
        params.append("ano", ano);
        if (cargo && cargo !== "TODOS") params.append("cargo", cargo);
        if (uf && uf !== "TODAS") params.append("uf", uf);
        if (partido && partido !== "TODOS") params.append("partido", partido);
        if (municipio && municipio !== "TODOS") params.append("municipio", municipio);

        const currentTab = activeTab;

        if (currentTab === "visao-geral") {
          url = `/api/visao-geral?${params.toString()}`;
        } else if (currentTab === "custo-do-voto") {
          if (!cargo || cargo === "TODOS") {
            setDynamicData(null);
            setDynamicLoading(false);
            return;
          }
          url = `/api/custo-do-voto?${params.toString()}`;
        } else if (currentTab === "porta-giratoria") {
          url = `/api/porta-giratoria?${params.toString()}`;
        } else if (currentTab === "origem-autofinanciamento") {
          url = `/api/origem-autofinanciamento?${params.toString()}`;
        }

        if (url) {
          setDynamicLoading(true);
          fetch(url)
            .then(r => {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.json();
            })
            .then(data => {
              setDynamicData({ tab: currentTab, ...data });
              setDynamicLoading(false);
            })
            .catch(err => {
              console.error("Erro ao carregar seção dinâmica:", err);
              setDynamicLoading(false);
            });
        }
      }, [activeTab, ano, cargo, uf, partido, municipio, meta]);

      if (loading || !globalData) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-[#0b0f19]">
            <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      const isGeralYear = ano === 2018 || ano === 2022;
      const rawCargos = (meta?.cargos_por_ano && Array.isArray(meta.cargos_por_ano[ano]) && meta.cargos_por_ano[ano].length) ? meta.cargos_por_ano[ano] : (CARGOS_PADRAO[ano] || []);
      const cargosValidos = [...rawCargos];
      if (isGeralYear && !cargosValidos.includes("DEPUTADO DISTRITAL")) {
        cargosValidos.splice(2, 0, "DEPUTADO DISTRITAL");
      }

      return (
        <div className="max-w-[1600px] mx-auto p-4 md:p-6 space-y-6">
          <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-gray-800 pb-4 mb-6 gap-4">
            <div className="flex items-center space-x-3">
              <div className="w-3 h-8 bg-blue-500 rounded-sm"></div>
              <div>
                <h1 className="text-xl md:text-2xl font-black tracking-wider text-white uppercase">PACD — PAINEL DE FINANCIAMENTO ELEITORAL</h1>
                <span className="text-xs text-blue-400 font-mono tracking-widest uppercase">BASE ELEITORAL BRASILEIRA 2018–2024</span>
              </div>
            </div>
          </header>
          
          {/* ================================================================= */}
          {/* 1. BLOCO FIXO GLOBAL: "TUDO E TODOS" (IMUNE A FILTROS)            */}
          {/* ================================================================= */}
          <div className="bg-[#111827] border border-gray-800 rounded-xl p-5 shadow-2xl space-y-6">
            
            {/* 4 KPIs Globais */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Volume Financeiro Ativo</span>
                <span className="text-2xl font-bold text-blue-400 mt-1 block">{formatMoeda(globalData.kpis.volume_financeiro_ativo)}</span>
              </div>
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Candidaturas no Recorte</span>
                <span className="text-2xl font-bold text-emerald-400 mt-1 block">{formatNumero(globalData.kpis.candidaturas_no_recorte)}</span>
              </div>
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Doadores no Recorte</span>
                <span className="text-2xl font-bold text-amber-400 mt-1 block">{formatNumero(globalData.kpis.doadores_no_recorte)}</span>
              </div>
              <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Transações Registradas</span>
                <span className="text-2xl font-bold text-purple-400 mt-1 block">{formatNumero(globalData.kpis.transacoes_registradas)}</span>
              </div>
            </div>

            {/* 4 Gráficos Globais */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              
              {/* Gráfico 1: Top 10 Doadores */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Top 10 Doadores</h3>
                <ChartCanvas
                  type="bar"
                  id="chart-global-doadores"
                  data={{
                    labels: globalData.graficos.top_10_doadores.map(d => d.nome.length > 22 ? d.nome.substring(0, 22) + '...' : d.nome),
                    datasets: [{
                      label: 'Total Doado (R$)',
                      data: globalData.graficos.top_10_doadores.map(d => d.total),
                      backgroundColor: '#3b82f6',
                      borderRadius: 4,
                    }]
                  }}
                  options={{ indexAxis: 'y' }}
                />
              </div>

              {/* Gráfico 2: Top 10 Candidatos Mais Financiados */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Top 10 Candidatos Mais Financiados</h3>
                <ChartCanvas
                  type="bar"
                  id="chart-global-candidatos"
                  data={{
                    labels: globalData.graficos.top_10_candidatos.map(d => `${d.nome.substring(0, 18)} (${d.partido})`),
                    datasets: [{
                      label: 'Receita Total (R$)',
                      data: globalData.graficos.top_10_candidatos.map(d => d.total),
                      backgroundColor: '#10b981',
                      borderRadius: 4,
                    }]
                  }}
                  options={{ indexAxis: 'y' }}
                />
              </div>

              {/* Gráfico 3: Distribuição do Volume Arrecadado (Escala Logarítmica) */}
              <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Distribuição do Volume Arrecadado (Escala Logarítmica)</h3>
                <ChartCanvas
                  type="bar"
                  id="chart-global-dist-log"
                  data={{
                    labels: globalData.graficos.distribuicao_log.map(d => d.faixa_reais),
                    datasets: [{
                      label: 'Candidaturas',
                      data: globalData.graficos.distribuicao_log.map(d => d.contagem),

            {/* SEÇÃO DINÂMICA 4: ORIGEM DOS RECURSOS & AUTOFINANCIAMENTO      */}
            {/* ------------------------------------------------------------- */}
            {!dynamicLoading && activeTab === 'origem-autofinanciamento' && dynamicData?.tab === 'origem-autofinanciamento' && dynamicData?.kpis && (
              <div className="space-y-6">
                
                {/* 4 KPIs Autofinanciamento */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                    <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Taxa de Autofinanciamento</span>
                    <span className="text-2xl font-bold text-amber-400 mt-1 block">{(dynamicData.kpis?.taxa_autofinanciamento || 0).toFixed(1)}%</span>
                  </div>
                  <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                    <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Volume Autofinanciado</span>
                    <span className="text-2xl font-bold text-emerald-400 mt-1 block">{formatMoeda(dynamicData.kpis?.volume_autofinanciamento || 0)}</span>
                  </div>
                  <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                    <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Volume de Terceiros</span>
                    <span className="text-2xl font-bold text-blue-400 mt-1 block">{formatMoeda(dynamicData.kpis?.volume_terceiros || 0)}</span>
                  </div>
                  <div className="bg-[#1f2937]/70 border border-gray-700/60 p-4 rounded-lg">
                    <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold block">Sucesso: Autofinanciados vs Terceiros</span>
                    <span className="text-2xl font-bold text-purple-400 mt-1 block">
                      {(dynamicData.kpis?.taxa_sucesso_auto || 0).toFixed(1)}%
                    </span>
                    <span className="text-xs text-gray-400 mt-0.5 block">
                      vs Terceiros ({(dynamicData.kpis?.taxa_sucesso_terceiros || 0).toFixed(1)}%)
                    </span>
                  </div>
                </div>

                {/* Gráficos Autofinanciamento */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  
                  {/* Maiores Investidores da Própria Campanha */}
                  <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                    <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Autofinanciamento: Os Maiores Investidores da Própria Campanha</h3>
                    <ChartCanvas
                      type="bar"
                      id="chart-auto-top"
                      data={{
                        labels: (dynamicData.top_investidores_proprios || []).map(d => `${String(d?.nome || '').substring(0, 18)} (${d?.partido || 'S/P'})`),
                        datasets: [{
                          label: 'Aporte Próprio (R$)',
                          data: (dynamicData.top_investidores_proprios || []).map(d => d.total),
                          backgroundColor: '#f59e0b',
                          borderRadius: 4,
                        }]
                      }}
                      options={{ indexAxis: 'y' }}
                    />
                  </div>

                  {/* Evolução Histórica */}
                  <div className="bg-[#1f2937]/50 border border-gray-800 p-4 rounded-lg">
                    <h3 className="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Evolução do Volume Financeiro por Origem</h3>
                    <ChartCanvas
                      type="bar"
                      id="chart-auto-evolucao"
                      data={{
                        labels: Array.from(new Set((dynamicData.evolucao_historica || []).map(d => d.ano))).sort(),
                        datasets: [
                          {
                            label: 'Recursos Próprios (R$)',
                            data: Array.from(new Set((dynamicData.evolucao_historica || []).map(d => d.ano))).sort().map(a => {
                              const item = (dynamicData.evolucao_historica || []).find(d => d.ano === a && d.tipo === 'Recursos Próprios');
                              return item ? item.total : 0;
                            }),
                            backgroundColor: '#f59e0b',
                            borderRadius: 4,
                          },
                          {
                            label: 'Terceiros (R$)',
                            data: Array.from(new Set((dynamicData.evolucao_historica || []).map(d => d.ano))).sort().map(a => {
                              const item = (dynamicData.evolucao_historica || []).find(d => d.ano === a && d.tipo === 'Terceiros');
                              return item ? item.total : 0;
                            }),
                            backgroundColor: '#3b82f6',
                            borderRadius: 4,
                          }
                        ]
                      }}
                    />
                  </div>

                </div>
              </div>
            )}

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
